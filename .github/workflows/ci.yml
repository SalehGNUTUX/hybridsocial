name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "28"

jobs:
  build-and-check:
    name: Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo (strict)
        run: mix credo --strict

  i18n:
    name: i18n Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check translation files
        working-directory: frontend/
        run: node scripts/check-i18n.mjs

  test:
    name: Test (partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    needs: build-and-check
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend/

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hybridsocial
          POSTGRES_PASSWORD: hybridsocial_dev
          POSTGRES_DB: hybridsocial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Each partition gets its own database (hybridsocial_test1..4) via the
      # MIX_TEST_PARTITION suffix baked into config/test.exs.
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      DATABASE_URL: ecto://hybridsocial:hybridsocial_dev@localhost/hybridsocial_test${{ matrix.partition }}
      VALKEY_URL: redis://localhost:6379/1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Create database
        run: mix ecto.create

      - name: Run migrations
        run: mix ecto.migrate

      - name: Run tests
        # --partitions splits the suite into 4 buckets; MIX_TEST_PARTITION
        # (set per matrix job) selects which bucket this runner executes.
        run: mix test --partitions 4

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: build-and-check
    defaults:
      run:
        working-directory: backend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Audit dependencies
        run: mix deps.audit

      - name: Run Sobelow
        run: mix sobelow --config

  # Build the deployable images and publish them to GHCR.
  #
  # This job already existed but discarded what it built (`push: false`), so
  # production rebuilt the same images itself — on a 4-core box, competing
  # with live traffic. Publishing here is step 1 of moving deploys off rsync:
  # nothing consumes these tags yet, so this change is inert in production.
  #
  # Tagged by commit SHA (immutable — what a deploy should pin to) and by
  # `latest`/`main` for convenience. The repo is public, so the packages are
  # public too and the host needs no registry credentials to pull.
  docker:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    needs: [test, security]
    # Runs on PRs too, but only *pushes* from main/tags (see `push:` below).
    # Previously this was skipped entirely on PRs, so a Dockerfile or
    # dependency break only surfaced after merge — and the frontend image was
    # never built in CI at all, only on the production host.
    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to GHCR.
      packages: write

    strategy:
      # Don't let one image failing hide whether the other built.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend/
          - name: frontend
            context: frontend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase path; the owner/repo may not be.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Build everywhere, publish only from main/tags. Keeps PR feedback
          # without filling the registry with per-PR images.
          push: ${{ github.event_name != 'pull_request' }}
          # The frontend bakes the short SHA into the bundle so the footer can
          # report which commit is deployed; harmless for the backend.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
